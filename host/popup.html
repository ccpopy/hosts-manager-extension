<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Hosts Manager</title>
    <link rel="stylesheet" href="./css/popup.css" />
  </head>
  <body>
    <div class="popup-container">
      <!-- 顶栏：字标 + 设置入口 -->
      <header class="popup-header">
        <div class="brand">
          <span class="wordmark">hosts-manager</span>
        </div>
        <button id="open-settings" class="icon-link" title="打开设置" aria-label="打开设置">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" width="18" height="18">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.343 3.94c.09-.542.56-.94 1.11-.94h1.093c.55 0 1.02.398 1.11.94l.149.894c.07.424.384.764.78.93.398.164.855.142 1.205-.108l.737-.527a1.125 1.125 0 011.45.12l.773.774c.39.389.44 1.002.12 1.45l-.527.737c-.25.35-.272.806-.107 1.204.165.397.505.71.93.78l.893.15c.543.09.94.56.94 1.109v1.094c0 .55-.397 1.02-.94 1.11l-.893.149c-.425.07-.765.383-.93.78-.165.398-.143.854.107 1.204l.527.738c.32.447.269 1.06-.12 1.45l-.774.773a1.125 1.125 0 01-1.449.12l-.738-.527c-.35-.25-.806-.272-1.203-.107-.397.165-.71.505-.781.929l-.149.894c-.09.542-.56.94-1.11.94h-1.094c-.55 0-1.019-.398-1.11-.94l-.148-.894c-.071-.424-.384-.764-.781-.93-.398-.164-.854-.142-1.204.108l-.738.527c-.447.32-1.06.269-1.45-.12l-.773-.774a1.125 1.125 0 01-.12-1.45l.527-.737c.25-.35.273-.806.108-1.204-.165-.397-.505-.71-.93-.78l-.894-.15c-.542-.09-.94-.56-.94-1.109v-1.094c0-.55.398-1.02.94-1.11l.894-.149c.424-.07.765-.383.93-.78.165-.398.143-.854-.108-1.204l-.526-.738a1.125 1.125 0 01.12-1.45l.773-.773a1.125 1.125 0 011.45-.12l.737.527c.35.25.807.272 1.204.107.397-.165.71-.505.78-.929l.15-.894z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
          </svg>
        </button>
      </header>

      <!-- 当前页面解析卡片：域名 → 映射 IP -->
      <section class="current-tab-card">
        <div class="card-eyebrow">当前页面</div>
        <div id="current-tab-body" class="current-tab-body">
          <div class="tab-state">加载中...</div>
        </div>
      </section>

      <!-- 分组列表 -->
      <section class="panel">
        <div class="panel-title">分组列表</div>
        <div id="groups-list">
          <div class="empty-state">加载中...</div>
        </div>
      </section>

      <!-- Socket 代理 -->
      <section class="panel">
        <div class="proxy-row" id="proxy-item">
          <span class="proxy-label">Socket 代理</span>
          <span id="proxy-status" class="status-text"></span>
          <label class="toggle-switch" id="proxy-toggle">
            <input type="checkbox" id="proxy-switch" />
            <span class="slider"></span>
          </label>
        </div>
      </section>

      <!-- 底部：版本号 + GitHub -->
      <footer class="popup-footer">
        <span class="version-chip" id="popup-version">v1.1.0</span>
        <a href="https://github.com/ccpopy/hosts-manager-extension" target="_blank" class="footer-link" title="查看项目源码" aria-label="GitHub 项目主页">
          <svg height="16" width="16" viewBox="0 0 16 16" aria-hidden="true">
            <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
          </svg>
        </a>
      </footer>
    </div>
    <script src="./js/popup.js"></script>
  </body>
</html>
